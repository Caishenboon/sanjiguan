[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanji-engine"
version = "0.1.0"
description = "Deterministic, framework-independent core for Sanjiguan"
requires-python = ">=3.11"
dependencies = [
  "astronomy-engine==2.1.19",
  "tzdata==2025.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sanji_engine = [
  "schemas/v1/*.json",
  "schemas/v2/*.json",
  "rulesets/*.json",
  "rulesets/assets/*.json",
  "golden_cases/**/*.json",
  "research_baselines/*.json",
  "yijing/assets/*.json",
  "bazi/assets/*.json",
  "ziwei/assets/*.json",
]
