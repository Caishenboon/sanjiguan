name: ci
on:
  pull_request:
  push:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  sanji-engine-determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install sanji-engine independently
        run: python -m pip install packages/sanji-engine
      - name: Cross-platform deterministic core tests
        run: python -m unittest tests.test_sanji_engine_core tests.test_sanji_engine_research tests.test_sanji_engine_yijing tests.test_sanji_engine_bazi_conformance tests.test_sanji_engine_bazi_four_pillars -v
      - name: Signals inference 30-case equivalence
        run: python scripts/capture_signals_inference_baseline.py
      - name: Engine boundary and activation gates
        run: |
          python scripts/validate_sanji_engine.py
          python scripts/validate_bazi_method_foundation.py
          python scripts/validate_bazi_four_pillars.py
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: sanjiguan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanjiguan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-ephemeral-only@localhost:5432/sanjiguan_test
      TEST_DATABASE_URL: postgresql://postgres:ci-ephemeral-only@localhost:5432/sanjiguan_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Apply migrations twice and detect drift
        run: |
          python scripts/migrate.py
          python scripts/migrate.py
      - name: PostgreSQL 16 RLS and concurrency integration
        run: python -m unittest tests.test_postgres_integration -v
      - name: HTTP to PostgreSQL E2E
        run: python -m unittest apps.api.tests.test_postgres_e2e -v
      - name: Python unit and memory API tests
        run: |
          for file in tests/test_*.py; do
            if [ "$file" != "tests/test_postgres_integration.py" ]; then
              python -m unittest discover -s tests -p "$(basename "$file")"
            fi
          done
          APP_ENV=test STORAGE_BACKEND=memory python -m unittest apps.api.tests.test_api -v
      - name: Contract and static gates
        run: |
          python scripts/validate_sprint0.py
          python scripts/validate_sprint05.py
          python scripts/export_openapi.py
          python scripts/export_sprint1b1_openapi.py
          python scripts/export_sprint1b2_openapi.py
          python scripts/validate_sprint1a.py
          python scripts/validate_sprint1a5.py
          python scripts/validate_sprint1a6.py
          python scripts/validate_sprint1b1.py
          python scripts/validate_sprint1b2.py
          python scripts/export_sprint2_openapi.py
          python scripts/export_bazi_four_pillars_openapi.py
          python scripts/validate_sprint2.py
          python scripts/validate_sprint3.py
          python scripts/validate_sanji_engine.py
          python scripts/validate_bazi_method_foundation.py
          python scripts/validate_bazi_four_pillars.py
          python scripts/check_product_language.py
          python scripts/check_secrets.py
          python scripts/check_doc_links.py
      - name: Sprint 3 responsive, PWA, privacy, and accessibility contracts
        run: python -m unittest tests.test_sprint3_contract -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: "11.9.0"
      - name: Web production build
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Gitleaks full-history scan
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.24.3
          detect --source=/repo --no-banner --redact
