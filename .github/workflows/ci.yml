name: ci
on:
  pull_request:
  push:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  sanji-engine-determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install sanji-engine independently
        run: python -m pip install packages/sanji-engine
      - name: Install deterministic test dependencies
        run: python -m pip install "jsonschema[format]==4.25.1"
      - name: Cross-platform deterministic core tests
        run: python -m unittest tests.test_sanji_engine_core tests.test_sanji_engine_research tests.test_sanji_engine_yijing tests.test_sanji_engine_bazi_conformance tests.test_sanji_engine_bazi_four_pillars tests.test_sanji_engine_ziwei tests.test_sanji_engine_liuxiang_v1 tests.test_sanji_engine_liuxiang_evidence_v1 tests.test_sanji_engine_topics_v1 -v
      - name: Signals inference 30-case equivalence
        run: python scripts/capture_signals_inference_baseline.py
      - name: Engine boundary and activation gates
        run: |
          python scripts/validate_sanji_engine.py
          python scripts/validate_bazi_method_foundation.py
          python scripts/validate_bazi_four_pillars.py
          python scripts/validate_ziwei_oracle_ui.py
          python scripts/validate_liuxiang_research_v1.py
          python scripts/validate_liuxiang_evidence_archive_v1.py
          python scripts/validate_topic_engines_v1.py
  web-visual-determinism:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            snapshot_platform: linux
          - os: windows-2025
            snapshot_platform: win32
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: "11.9.0"
      - name: Install and build Web
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Playwright Chromium on Linux
        if: runner.os == 'Linux'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        working-directory: apps/web
        run: pnpm exec playwright install chromium
      - name: Playwright Chromium visual regression
        id: visual_regression
        continue-on-error: true
        working-directory: apps/web
        run: pnpm test:visual
      - name: Collect visual regression evidence
        if: steps.visual_regression.outcome == 'failure'
        run: >-
          python scripts/collect_visual_regression_evidence.py
          --platform ${{ matrix.snapshot_platform }}
      - name: Upload visual regression evidence
        if: steps.visual_regression.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-${{ matrix.snapshot_platform }}-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce visual regression result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.visual_regression.outcome }}" != "success" ]; then
            echo "Visual regression failed; inspect the uploaded evidence artifact."
            exit 1
          fi
  baseline:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: sanjiguan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanjiguan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-ephemeral-only@localhost:5432/sanjiguan_test
      TEST_DATABASE_URL: postgresql://postgres:ci-ephemeral-only@localhost:5432/sanjiguan_test
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: |
          python -m pip install -r apps/api/requirements.txt
          python -m pip install packages/oracle-adapters lunar-python==1.4.8 tyme4py==1.5.0 sxtwl==2.0.7
      - name: Apply migrations twice and detect drift
        run: |
          python scripts/migrate.py
          python scripts/migrate.py
      - name: PostgreSQL 16 RLS and concurrency integration
        run: python -m unittest tests.test_postgres_integration -v
      - name: HTTP to PostgreSQL E2E
        run: python -m unittest apps.api.tests.test_postgres_e2e -v
      - name: Python unit and memory API tests
        run: |
          for file in tests/test_*.py; do
            if [ "$file" != "tests/test_postgres_integration.py" ] && [ "$file" != "tests/test_oracle_adapters.py" ]; then
              python -m unittest discover -s tests -p "$(basename "$file")"
            fi
          done
          APP_ENV=test STORAGE_BACKEND=memory python -m unittest apps.api.tests.test_api -v
      - name: Contract and static gates
        run: |
          python scripts/validate_sprint0.py
          python scripts/validate_sprint05.py
          python scripts/export_openapi.py
          python scripts/export_sprint1b1_openapi.py
          python scripts/export_sprint1b2_openapi.py
          python scripts/validate_sprint1a.py
          python scripts/validate_sprint1a5.py
          python scripts/validate_sprint1a6.py
          python scripts/validate_sprint1b1.py
          python scripts/validate_sprint1b2.py
          python scripts/export_sprint2_openapi.py
          python scripts/export_bazi_four_pillars_openapi.py
          python scripts/export_ziwei_openapi.py
          python scripts/export_liuxiang_openapi.py --check
          python scripts/export_liuxiang_archive_openapi.py --check
          python scripts/export_topic_openapi.py --check
          python scripts/validate_sprint2.py
          python scripts/validate_sprint3.py
          python scripts/validate_sanji_engine.py
          python scripts/validate_bazi_method_foundation.py
          python scripts/validate_bazi_four_pillars.py
          python scripts/validate_ziwei_oracle_ui.py
          python scripts/validate_visual_regression.py
          python scripts/validate_liuxiang_research_v1.py
          python scripts/validate_product_spine_v1.py
          python scripts/validate_liuxiang_evidence_archive_v1.py
          python scripts/validate_topic_engines_v1.py
          python scripts/research_data.py validate
          python scripts/check_product_language.py
          python scripts/check_secrets.py
          python scripts/check_doc_links.py
      - name: Sprint 3 responsive, PWA, privacy, and accessibility contracts
        run: python -m unittest tests.test_sprint3_contract -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: "11.9.0"
      - name: Web production build
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install pinned iztro Oracle
        working-directory: packages/oracle-adapters/src/oracle_adapters/ziwei/iztro
        run: pnpm install --frozen-lockfile
      - name: Execute Oracle differential tests
        env:
          SANJI_IZTRO_RUNTIME_DIR: packages/oracle-adapters/src/oracle_adapters/ziwei/iztro
        run: python -m unittest tests.test_oracle_adapters -v
      - name: Storybook build and accessibility stories
        working-directory: packages/sanji-ui
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm build-storybook
      - name: Lighthouse quality budgets
        working-directory: apps/web
        run: pnpm exec lhci autorun --config=lighthouserc.json
      - name: Gitleaks full-history scan
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.24.3
          detect --source=/repo --no-banner --redact
