[project]
name = "samsara-engine"
version = "1.0.0rc1"
requires-python = ">=3.11"
dependencies = [
  "astronomy-engine==2.1.19",
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "psycopg[binary,pool]==3.2.9",
  "tzdata==2025.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "jsonschema[format]==4.25.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
