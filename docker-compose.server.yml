services:
  web:
    ports: []
    networks: [private]

  caddy:
    image: caddy:2.10.0-alpine
    environment:
      DOMAIN: ${DOMAIN:?set the deployment domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [private, egress]

volumes:
  caddy-data:
  caddy-config:
