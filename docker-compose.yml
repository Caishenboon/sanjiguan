services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: samsara
      POSTGRES_USER: migration_owner
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?set in ignored local environment}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_owner -d samsara"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://app_runtime:${POSTGRES_APP_PASSWORD:?set in ignored local environment}@postgres:5432/samsara
      DEEPSEEK_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
